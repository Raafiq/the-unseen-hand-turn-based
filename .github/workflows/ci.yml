name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: typecheck · lint · determinism · test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required by the handoff gate below — it measures how far
      # docs/NEXT.md's stamp is behind HEAD, which needs real history, not a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # docs/NEXT.md is the session-to-session handoff — the one piece of state a machine
      # cannot derive, and therefore the one that can silently rot. The SessionStart hook
      # warns as it ages; this is the hard stop, so the convention cannot decay into a lie
      # that reads as authoritative (CLAUDE.md, the evidence principle).
      #
      # PUSH EVENTS ONLY, deliberately: on a pull_request event GitHub checks out a MERGE
      # ref (PR head merged into base), so the drift count would include base commits the
      # branch never authored and the gate would fail for the wrong reason. Every PR branch
      # is pushed, so this still runs on everything.
      - name: Handoff (docs/NEXT.md) is not stale
        if: github.event_name == 'push'
        run: npm run check:handoff

      # The story pack is swappable by contract (docs/11 AC-M4); a test pinning its
      # prose makes exercising that seam a build failure. Four did, and the first two
      # only surfaced when a one-line content fix broke the suite.
      - name: No test pins story-pack prose
        run: npm run check:story

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Static half of the determinism invariant (ADR-0004). The dynamic half is
      # the replay-equality harness, which runs as part of the test suite.
      - name: Determinism guard (no unseeded RNG / wall-clock in sim)
        run: npm run check:rng

      - name: Test
        run: npm run test

      # Drift-proofing: the "state of the engine" dashboard is generated from the repo's
      # actual state (data counts + a LIVE diversity-gate run). Regenerate it and fail if
      # the committed copy drifted — this only works because the output is deterministic.
      - name: State dashboard is not stale
        run: |
          npm run state
          if ! git diff --exit-code state/index.html; then
            echo "::error::state/index.html is stale. Run 'npm run state' and commit the regenerated file."
            exit 1
          fi

  visual:
    name: visual tests (screenshots + video)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds the viewer, drives it in a headless browser, captures screenshots
      # + video, and assembles the gallery.
      - name: Run visual tests
        run: npm run test:visual

      - name: Build gallery
        if: ${{ !cancelled() }}
        run: npm run gallery

      - name: Upload visual artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            visual-artifacts/screenshots
            visual-artifacts/gallery
          if-no-files-found: warn
