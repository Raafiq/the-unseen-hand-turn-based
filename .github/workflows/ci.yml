name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: typecheck · lint · determinism · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Static half of the determinism invariant (ADR-0004). The dynamic half is
      # the replay-equality harness, which runs as part of the test suite.
      - name: Determinism guard (no unseeded RNG / wall-clock in sim)
        run: npm run check:rng

      - name: Test
        run: npm run test
