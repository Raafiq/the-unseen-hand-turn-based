name: Deploy viewer to GitHub Pages

# Builds the engine viewer + the visual-test gallery and publishes them to
# GitHub Pages on every merge to main. One-time setup: repo Settings → Pages →
# "Build and deployment" → Source = "GitHub Actions".
#
# Result: the live viewer at the Pages URL, and the screenshot/video gallery at
# <pages-url>/visual/.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # PREFLIGHT — assert Pages is actually wired to Actions BEFORE spending four
      # minutes building an artifact nothing will deploy.
      #
      # Why this exists: for 17 consecutive runs (2026-07-30 … 2026-08-09) `build`
      # was green and only `deploy` failed, so the run looked "mostly fine" while
      # the site had never once existed. Worse, GitHub changed the failure mode
      # partway through: the later runs are rejected at the environment gate before
      # a runner is ever assigned, so `deploy` fails in ONE SECOND with no steps and
      # ZERO log bytes — the log download 404s. A failure with no error text reads
      # like an infra blip rather than a misconfiguration.
      #
      # `build_type` is the discriminating field, and it comes out the other way:
      #   "workflow" → Settings→Pages→Source = "GitHub Actions"   (deploy can work)
      #   "legacy"   → Source = "Deploy from a branch"            (deploy ALWAYS fails)
      #   404        → Pages not enabled at all                   (deploy ALWAYS fails)
      # A green preflight therefore means something; it cannot pass while the site
      # is unreachable, which is exactly what the old silent-green build did.
      - name: Preflight — Pages must be enabled with Source = "GitHub Actions"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")
          echo "GET /pages -> HTTP $code"; cat /tmp/pages.json; echo
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is NOT enabled for this repository. Enable it at Settings → Pages, and set Build and deployment → Source = \"GitHub Actions\"."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Could not read Pages configuration (HTTP $code). Refusing to build an artifact that may not deploy."
            exit 1
          fi
          build_type=$(python3 -c 'import json;print(json.load(open("/tmp/pages.json")).get("build_type") or "")')
          echo "Pages build_type = '$build_type'"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages is enabled but Source is '$build_type', not 'workflow'. actions/deploy-pages CANNOT deploy in this mode — the deploy job is rejected at the environment gate with no logs. Fix: Settings → Pages → Build and deployment → Source = \"GitHub Actions\"."
            exit 1
          fi
          echo "Pages is wired to GitHub Actions — deploy can proceed."

      # PREFLIGHT 2 — the `github-pages` environment must ALLOW this branch.
      #
      # This is the one that actually bit. The environment carried a custom
      # deployment-branch policy listing exactly one branch —
      # `claude/fft-combat-design-e32fm1`, a feature branch dead since 2026-07-30 —
      # so every deploy from `main` was refused by the gate before a runner existed.
      # That refusal is *invisible*: no steps, no annotation, no log bytes. Checking
      # `/pages` alone would NOT have caught it (that endpoint answers 200 with
      # build_type=workflow while the gate still refuses every branch you have), so
      # a guard that stopped at preflight 1 would have gone green on a dead deploy —
      # exactly the failure it exists to prevent.
      - name: Preflight — the github-pages environment must allow this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"; }
          base="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/environments/github-pages"
          custom=$(api "$base" | jq -r '.deployment_branch_policy.custom_branch_policies // false')
          echo "custom_branch_policies = $custom"
          if [ "$custom" != "true" ]; then
            echo "No custom branch policy — the gate does not filter by branch here."
            exit 0
          fi
          names=$(api "$base/deployment-branch-policies" | jq -r '.branch_policies[].name')
          echo "Allowed branches:"; echo "$names" | sed 's/^/  - /'
          allowed=no
          while IFS= read -r n; do
            [ -z "$n" ] && continue
            case "$GITHUB_REF_NAME" in $n) allowed=yes ;; esac
          done <<<"$names"
          if [ "$allowed" = "yes" ]; then
            echo "'$GITHUB_REF_NAME' is allowed to deploy."
            exit 0
          fi
          msg="Branch '$GITHUB_REF_NAME' is NOT in the github-pages environment's deployment-branch policy, so the deploy job will be refused at the environment gate with NO logs. Fix: Settings → Environments → github-pages → Deployment branches — add '$GITHUB_REF_NAME' (and drop any stale feature-branch entries)."
          # Read the default branch from the API, NOT from github.event.repository — an
          # event whose payload omits `repository` would leave that expression empty, the
          # comparison would be false, and the guard would quietly downgrade to a warning
          # on the one branch that actually publishes. Fail closed if it cannot be read.
          default_branch=$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}" | jq -r '.default_branch // empty')
          if [ -z "$default_branch" ]; then
            echo "::error::Could not determine the default branch; refusing to downgrade this to a warning."
            exit 1
          fi
          echo "default branch = $default_branch"
          if [ "$GITHUB_REF_NAME" = "$default_branch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Build once at base "/" so the preview server + visual tests line up.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run gallery

      # Rebuild under the project-site base path for the actual deploy, then
      # fold the gallery in under /visual/.
      - name: Build for Pages base path
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Add the visual gallery
        run: cp -r visual-artifacts/gallery dist/visual

      # Regenerate the state dashboard (deterministic) and fold it in under /state/.
      - name: Add the state dashboard
        run: |
          npm run state
          mkdir -p dist/state
          cp state/index.html dist/state/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
