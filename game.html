<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The campaign moved to the site ROOT. This stub stays because the path was
      public: README.md links it, docs/11 names it as where the game is played, and
      the repo has been public since 2026-08-09. A 404 on the one URL that has been
      shared costs more than deleting a nine-line file saves.

      A meta-refresh, not a script: it redirects with scripting disabled, and there is
      no server here to issue a 301. The link below is not decoration — it is what a
      reader sees if the refresh is ignored or blocked, and it is what the browser
      test follows when it asserts this page does not simply render blank.
    -->
    <meta http-equiv="refresh" content="0; url=./" />
    <title>The First March — moved to the site root</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e1117;
        color: #cdd6e6;
        font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      a { color: #e0a33e; }
    </style>
  </head>
  <body>
    <p data-testid="moved">
      The First March now lives at the top of this site.<br />
      <a href="./" data-testid="moved-link">▶ Play the campaign</a>
    </p>
  </body>
</html>
