installed:
- drift
- reconcile
- sync
settings:
  auto_execute_hooks: true
hooks:
  after_implement:
  - extension: reconcile
    command: speckit.reconcile.run
    enabled: true
    optional: true
    priority: 20
    prompt: Reconcile drift the implementation introduced? Re-run with a feature path
      and a description of what drifted, e.g. specs/001-feature the screen shipped
      but is unreachable.
    description: Amend the feature's spec, plan, and tasks from a gap report
    condition: null
  after_converge:
  - extension: reconcile
    command: speckit.reconcile.run
    enabled: true
    optional: true
    priority: 20
    prompt: Was the code ahead of the artifacts rather than behind? Re-run this command
      with a feature path and a description of what drifted, e.g. specs/001-feature
      the endpoint shipped but the plan never declared it.
    description: Amend the feature's spec, plan, and tasks from a gap report
    condition: null
